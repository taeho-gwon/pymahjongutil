[tool.poetry]
name = "pymahjongutil"
version = "0.1.0"
description = ""
authors = ["Taeho Gwon <taehogwon96@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^1.24.3"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.3.1"
mypy = "^1.3.0"
pytest = "^7.0.0"
autoflake = "^2.1.1"
isort = "^5.12.0"
black = "^23.3.0"
coverage = "^7.2.7"
setuptools = "^68.2.2"
wheel = "^0.41.3"
twine = "^4.0.2"
ruff = "^0.9.3"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "I", "N", "W", "B", "C", "D"]
ignore = ["D100", "D104"]

[tool.coverage.run]
branch = true
source = ["pymahjongutil"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "\\.\\.\\."
]
fail_under = 95
show_missing = true

[project]
requires-python = ">=3.12"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
