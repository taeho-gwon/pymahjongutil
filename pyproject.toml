[project]
name = "pymahjongutil"
version = "0.1.0"
description = ""
authors = [{ name = "Taeho Gwon", email = "taehogwon96@gmail.com" }]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=3.3.1",
    "mypy>=1.3.0",
    "pytest>=7.0.0",
    "coverage>=7.2.7",
    "pytest-cov>=4.0.0",
    "ruff>=0.9.3",
]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
branch = true
source = ["pymahjongutil"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "\\.\\.\\.",
]
fail_under = 95
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
